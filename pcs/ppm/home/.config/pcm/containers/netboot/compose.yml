# netboot.xyz for pcs: TFTP for the PXE boot loaders and menus, and HTTP for
# the installers and each host's preseed.
#
# pcm service, installed by the pcs ppm package. pcs writes into its volumes
# (`pcs reconcile`): per-host boot menus (MAC-<mac>.ipxe, which netboot.xyz runs
# before its own menu) into config/menus, and installers and preseeds into
# assets. nginx serves new files without a restart.
#
# The host's network, because TFTP answers from ephemeral ports (which port
# mapping breaks); TFTP's port 69/udp needs net.ipv4.ip_unprivileged_port_start
# at or below 69 under rootless podman. NETBOOT_HTTP_PORT must match pcs's
# netboot.http_port setting. Every variable, with its default, lives in .env.schema.
name: netboot

services:
  netboot:
    image: ${NETBOOT_IMAGE}:${NETBOOT_TAG}
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_BIND_SERVICE
    environment:
      NGINX_PORT: ${NETBOOT_HTTP_PORT}
      WEB_APP_PORT: ${NETBOOT_WEB_PORT}
      TZ: ${NETBOOT_TIMEZONE}
    volumes:
      - ${PCM_VOLUMES_HOME}/netboot/config:/config
      - ${PCM_VOLUMES_HOME}/netboot/assets:/assets
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:${NETBOOT_HTTP_PORT}/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
