# dnsmasq for pcs: proxy DHCP, so PXE clients at the site boot from this
# machine while the site's DHCP server keeps handing out addresses.
#
# pcm service, installed by the pcs ppm package. pcs writes the config
# (`pcs reconcile` renders pcs.conf into ${PCM_VOLUMES_HOME}/dnsmasq/dnsmasq.d)
# and restarts this service when it changes. TFTP is served by the netboot service.
#
# DHCP needs the host's network (broadcasts) and ports 67/udp and 4011/udp:
# rootless podman needs net.ipv4.ip_unprivileged_port_start=67 (the package's
# install.sh sets it). Every variable, with its default, lives in .env.schema.
name: dnsmasq

services:
  dnsmasq:
    image: ${DNSMASQ_IMAGE}:${DNSMASQ_TAG}
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - NET_BIND_SERVICE
    # Run dnsmasq directly (not the image's entrypoint, which writes its own
    # DNS config): DNS off, config only from pcs's directory, logs to stdout.
    entrypoint: ["dnsmasq"]
    command:
      - --keep-in-foreground
      - --log-facility=-
      - --port=0
      - --conf-file=/dev/null
      - --conf-dir=/etc/dnsmasq.d/,*.conf
    volumes:
      - ${PCM_VOLUMES_HOME}/dnsmasq/dnsmasq.d:/etc/dnsmasq.d:ro
